# The offline tests (tests/run-tests.ps1) on every OS the kit's scripts support.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main each get their own group: in a shared
# one, a queued run would cancel the one still waiting, and that commit would never be tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CONTRIBUTING.md asks for PowerShell 7.2+ and git 2.38+; the log shows what the runner has.
      - name: Tool versions
        shell: pwsh
        run: |
          "pwsh $($PSVersionTable.PSVersion)"
          git --version

      - name: Run the offline tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/run-tests.ps1
